    <style type="text/css">
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        .navbar{
            background:whitesmoke;
            padding-right: 15px; padding-left: 15px;
        }
        .navdiv{
            display: flex; 
            align-items: center;
            justify-content: space-between;

        li{
            list-style: none;
            display: inline-block;
        }
        li a{
            color: rgb(92, 90, 90);

        }
        .button{
            color: white;
            background-color: blue;

            border-radius: 10px 20px;
            padding: 10px;
            text-decoration: none;
        }
        .hero{
            width: 100%;
            min-height: 100vh;
            background: url(banner.jpg);
           background-size: cover;
            object-fit: cover;
            display: flex;
             justify-content: center;
            align-items: center;
            position: relative;
        }
        .hero::before {
            content:"";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .hero .content{
            position: relative;
            text-align: center;
            color: white;
            max-width: 80%;
        }
        .hero .content h1{
            font-size: 65px;
            margin-bottom: 20px;
        }
        .hero .content p{
            font-size: 22px;
            line-height: 1.5;
        }
        
    </style>
</head>
